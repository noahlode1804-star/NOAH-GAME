name: Build NOAH GAME

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set automatic version
        env:
          VERSION: 1.0.${{ github.run_number }}
        run: |
          node -e "const fs = require('fs'); const p = require('./package.json'); p.version = process.env.VERSION; fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');"

      - name: Build Windows installer
        run: npm run build

      - name: Publish installer and update files
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: NOAH GAME Latest
          make_latest: true
          files: installer/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}